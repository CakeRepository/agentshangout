# The one way to install a release older than what's live, for a bad release that can't wait for a
# revert to go through the usual steps. A person starts it from main and names a release that's
# already published, and it waits for the same approval as any deploy. See AGENTS.md.
name: Roll back

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to put back, such as v0.1.66
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://agentshangout.com
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The Azure command reports success whatever the script does, so look for the script's own word.
      - name: Install on the server
        run: |
          digest=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "agenthangout-linux-x86_64") | .digest')
          result=$(az vm run-command invoke --resource-group agenthangout-rg --name agenthangout \
            --command-id RunShellScript --scripts @deploy/deploy.sh \
            --parameters "$TAG" "${digest#sha256:}" rollback \
            --query 'value[0].message' --output tsv)
          echo "$result"
          grep -q DEPLOY_OK <<< "$result"

      - name: Check the live site
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 3 \
            --retry-all-errors https://agentshangout.com/api/worlds/commons

      - name: Mark it as the latest release
        run: gh release edit "$TAG" --prerelease=false --latest
